name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test --release
      - run: cargo build --release --no-default-features --features "echo,cat,ls,sh"

  upstream-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: busybox-rs
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: busybox-rs
        run: cargo build --release
      - run: |
          mkdir -p test-bin
          cp busybox-rs/target/release/busybox test-bin/busybox
          cp busybox-rs/configs/defconfig test-bin/.config
      - run: git clone --depth 1 https://git.busybox.net/busybox busybox-upstream
      - working-directory: busybox-upstream/testsuite
        run: |
          bindir=$GITHUB_WORKSPACE/test-bin ./runtest echo dirname basename fold tsort comm factor expand unexpand uuencode cut rev xxd head uniq seq cp grep sort tail tr cat cmp readlink realpath md5sum sha1sum sha256sum sha512sum sum printf
