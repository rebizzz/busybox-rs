name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/busybox dist/busybox-x86_64-unknown-linux-musl
          chmod +x dist/busybox-x86_64-unknown-linux-musl
          cd dist && sha256sum busybox-x86_64-unknown-linux-musl > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/busybox-x86_64-unknown-linux-musl
            dist/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
