[package]
name = "busybox"
version = "0.1.0"
edition = "2021"
authors = ["Busybox-RS Contributors"]
description = "A memory-safe, modular, customizable reimplementation of BusyBox in Rust"
license = "MIT"

[dependencies]
libc = "0.2"

[lib]
name = "busybox"
path = "src/lib.rs"

[[bin]]
name = "busybox"
path = "src/main.rs"

